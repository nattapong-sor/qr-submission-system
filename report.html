<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สรุปผล | ระบบสแกน QR บันทึกชิ้นงาน</title>
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
<div class="topbar">
  <div class="brand">📚 ระบบส่งชิ้นงาน</div>
  <nav>
    <a href="scan.html">สแกน</a>
    <a href="dashboard.html">วิชา/ชิ้นงาน</a>
    <a href="students.html">นักเรียน</a>
    <a href="report.html" class="active">สรุปผล</a>
    <a href="#" onclick="logout()">ออกจากระบบ</a>
  </nav>
</div>

<div class="container" style="max-width:1100px;">
  <div id="msg"></div>

  <div class="card">
    <h2>เลือกวิชาเพื่อดูสรุปผล</h2>
    <select id="subjectSelect"><option value="">-- เลือกวิชา --</option></select>
  </div>

  <div class="card" id="reportCard" style="display:none;">
    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
      <h2 id="reportTitle">สรุปผลการส่งงาน</h2>
      <button class="secondary no-print" onclick="exportExcel()">📥 ดาวน์โหลด Excel</button>
    </div>
    <div style="overflow-x:auto;">
      <table id="reportTable">
        <thead><tr id="reportHeadRow"></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</div>

<script src="assets/supabaseClient.js"></script>
<script>
let assignmentsForSubject = [];
let matrixData = []; // { student, cells: {assignmentId: true/false} }
let currentSubjectName = "";

async function init() {
  const session = await requireLogin();
  if (!session) return;
  await loadSubjects();
}

async function loadSubjects() {
  const { data, error } = await supabaseClient.from("subjects").select("id, name").order("name");
  if (error) { showMsg("โหลดวิชาไม่สำเร็จ: " + error.message, "error"); return; }
  const sel = document.getElementById("subjectSelect");
  data.forEach(s => {
    const opt = document.createElement("option");
    opt.value = s.id; opt.textContent = s.name;
    sel.appendChild(opt);
  });
}

document.getElementById("subjectSelect").addEventListener("change", async (e) => {
  const subjectId = e.target.value;
  if (!subjectId) { document.getElementById("reportCard").style.display = "none"; return; }
  currentSubjectName = e.target.options[e.target.selectedIndex].textContent;
  await buildReport(subjectId);
});

async function buildReport(subjectId) {
  const { data: assignments, error: aErr } = await supabaseClient
    .from("assignments").select("id, name").eq("subject_id", subjectId).order("created_at");
  if (aErr) { showMsg("โหลดชิ้นงานไม่สำเร็จ: " + aErr.message, "error"); return; }
  assignmentsForSubject = assignments;

  const { data: students, error: sErr } = await supabaseClient
    .from("students").select("id, full_name, classroom").order("classroom").order("full_name");
  if (sErr) { showMsg("โหลดนักเรียนไม่สำเร็จ: " + sErr.message, "error"); return; }

  const assignmentIds = assignments.map(a => a.id);
  let submissions = [];
  if (assignmentIds.length > 0) {
    const { data, error } = await supabaseClient
      .from("submissions").select("student_id, assignment_id").in("assignment_id", assignmentIds);
    if (error) { showMsg("โหลดข้อมูลส่งงานไม่สำเร็จ: " + error.message, "error"); return; }
    submissions = data;
  }

  matrixData = students.map(stu => {
    const cells = {};
    assignments.forEach(a => {
      cells[a.id] = submissions.some(sub => sub.student_id === stu.id && sub.assignment_id === a.id);
    });
    return { student: stu, cells };
  });

  renderTable();
  document.getElementById("reportCard").style.display = "block";
  document.getElementById("reportTitle").textContent = `สรุปผลการส่งงาน: ${currentSubjectName}`;
}

function renderTable() {
  const headRow = document.getElementById("reportHeadRow");
  headRow.innerHTML = "<th>เลขที่</th><th>ชื่อ-นามสกุล</th><th>ห้อง</th>" +
    assignmentsForSubject.map(a => `<th>${a.name}</th>`).join("") +
    "<th>รวม (ส่งแล้ว/ทั้งหมด)</th>";

  const tbody = document.querySelector("#reportTable tbody");
  tbody.innerHTML = "";
  matrixData.forEach((row, i) => {
    const done = Object.values(row.cells).filter(Boolean).length;
    const total = assignmentsForSubject.length;
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${i + 1}</td><td>${row.student.full_name}</td><td>${row.student.classroom || "-"}</td>` +
      assignmentsForSubject.map(a => row.cells[a.id]
        ? `<td><span class="badge ok">✓ ส่งแล้ว</span></td>`
        : `<td><span class="badge missing">ยังไม่ส่ง</span></td>`).join("") +
      `<td><b>${done} / ${total}</b></td>`;
    tbody.appendChild(tr);
  });
}

function exportExcel() {
  const header = ["เลขที่", "ชื่อ-นามสกุล", "ห้อง", ...assignmentsForSubject.map(a => a.name), "รวม (ส่งแล้ว/ทั้งหมด)"];
  const rows = matrixData.map((row, i) => {
    const done = Object.values(row.cells).filter(Boolean).length;
    return [
      i + 1, row.student.full_name, row.student.classroom || "-",
      ...assignmentsForSubject.map(a => row.cells[a.id] ? "ส่งแล้ว" : "ยังไม่ส่ง"),
      `${done}/${assignmentsForSubject.length}`
    ];
  });
  const ws = XLSX.utils.aoa_to_sheet([header, ...rows]);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "สรุปผล");
  XLSX.writeFile(wb, `สรุปผลการส่งงาน_${currentSubjectName}.xlsx`);
}

function showMsg(text, type) {
  document.getElementById("msg").innerHTML = `<div class="msg ${type}">${text}</div>`;
}

init();
</script>
</body>
</html>
